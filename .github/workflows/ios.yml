# ERST NACH FREIGABE DES APPLE-DEVELOPER-KONTOS DES VEREINS VERWENDEN (Secrets aus dem Vereinskonto!).
# Baut die iOS-App auf einem Cloud-Mac und lädt sie zu App Store Connect hoch.
# Benötigte Secrets im GitHub-Repo (Settings → Secrets → Actions):
#   APPLE_TEAM_ID        – Team-ID aus developer.apple.com (10 Zeichen)
#   ASC_KEY_ID           – App Store Connect API-Key: Key-ID
#   ASC_ISSUER_ID        – App Store Connect API-Key: Issuer-ID
#   ASC_KEY_P8           – Inhalt der .p8-Datei des API-Keys (kompletter Text)
# Der Key braucht die Rolle "App Manager". Signierung läuft automatisch über "Cloud Managed Signing".
name: iOS-App bauen und zu App Store Connect hochladen
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/brand.mjs && node scripts/snapshot.mjs
      - run: npx cap sync ios
      - name: Xcode 26 auswählen
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X" && xcodebuild -version
      - name: API-Key ablegen
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archiv bauen
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive archive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: IPA exportieren
        run: |
          cd ios/App
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $PWD/build/ipa \
            -allowProvisioningUpdates -authenticationKeyPath ~/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
      - name: Hochladen
        run: |
          cd ios/App
          xcrun altool --upload-app -f build/ipa/App.ipa -t ios --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: ios/App/build/ipa/*.ipa }
